name: Build and push image

# Builds the production image on GitHub's runners instead of the Dokploy host.
# The host runs ~9 apps and several databases on 8GB; a `next build` of this app
# peaks around 2.1GB, which pushed it into swap and made deploys take 50+ minutes
# before failing. Building here and shipping a finished image keeps that load off
# production entirely.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_* are inlined into the client bundle at build time, so they
          # must be passed here — setting them as runtime env in Dokploy has no effect.
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://herizioptic.com' }}
            NEXT_PUBLIC_STORE_CURRENCY=${{ vars.NEXT_PUBLIC_STORE_CURRENCY || 'DZD' }}
            NEXT_PUBLIC_META_PIXEL_ID=${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only fires once the Dokploy credentials are configured as repo secrets.
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Trigger Dokploy pull and redeploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          if [ -z "$DOKPLOY_TOKEN" ] || [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_APPLICATION_ID" ]; then
            echo "Dokploy secrets not configured — image was pushed, but no redeploy was triggered."
            echo "Set DOKPLOY_URL, DOKPLOY_TOKEN and DOKPLOY_APPLICATION_ID to enable this step."
            exit 0
          fi
          code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X POST \
            -H "x-api-key: $DOKPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$DOKPLOY_APPLICATION_ID\"}" \
            "$DOKPLOY_URL/api/application.deploy")
          echo "Dokploy responded $code"
          cat /tmp/resp.txt || true
          [ "$code" = "200" ]
