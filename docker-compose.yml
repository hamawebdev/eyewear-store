version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: roya-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: roya
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-in-production}
      POSTGRES_DB: roya
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roya -d roya"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roya-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - DATABASE_URL=postgres://roya:${DB_PASSWORD:-change-me-in-production}@postgres:5432/roya
      - PAYLOAD_SEED_ADMIN_EMAIL=${PAYLOAD_SEED_ADMIN_EMAIL}
      - PAYLOAD_SEED_ADMIN_PASSWORD=${PAYLOAD_SEED_ADMIN_PASSWORD}
      - PAYLOAD_SEED_ADMIN_NAME=${PAYLOAD_SEED_ADMIN_NAME:-Store Admin}
      - NEXT_PUBLIC_STORE_CURRENCY=${NEXT_PUBLIC_STORE_CURRENCY:-USD}
      - YALIDINE_API_ID=${YALIDINE_API_ID}
      - YALIDINE_API_TOKEN=${YALIDINE_API_TOKEN}
      - YALIDINE_API_BASE_URL=${YALIDINE_API_BASE_URL:-https://api.yalidine.app}
      - YALIDINE_WEBHOOK_SECRET=${YALIDINE_WEBHOOK_SECRET}
      - YALITEC_API_ID=${YALITEC_API_ID}
      - YALITEC_API_TOKEN=${YALITEC_API_TOKEN}
      - YALITEC_API_BASE_URL=${YALITEC_API_BASE_URL:-https://api.yalitec.me}
      - YALITEC_WEBHOOK_SECRET=${YALITEC_WEBHOOK_SECRET}
      - GOOGLE_SHEETS_WEBHOOK_URL=${GOOGLE_SHEETS_WEBHOOK_URL}
      - GOOGLE_SHEETS_WEBHOOK_SECRET=${GOOGLE_SHEETS_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
